name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # ========================================================================
      # 1. CHECKOUT REPOSITORY
      # ========================================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ========================================================================
      # 2. VALIDATE REQUIRED GITHUB ACTIONS SECRETS (Using Env Variables)
      # ========================================================================
      - name: Validate GitHub Secrets Configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "=========================================================="
          echo "🔍 Validating Deployment Secrets..."
          echo "=========================================================="
          MISSING=0
          if [ -z "$FTP_SERVER" ]; then
            echo "❌ ERROR: FTP_SERVER secret is not configured in GitHub Secrets!"
            MISSING=1
          elif [ "$FTP_SERVER" = "." ] || [ "$FTP_SERVER" = "./" ] || [ "$FTP_SERVER" = "/" ]; then
            echo "⚠️ NOTICE: FTP_SERVER secret was set to '$FTP_SERVER' (directory). Auto-recovering to Hostinger server IP: 145.79.210.95"
            FTP_SERVER="145.79.210.95"
          else
            echo "✅ FTP_SERVER secret is configured"
            SERVER_CLEAN="${FTP_SERVER#ftp://}"
            SERVER_CLEAN="${SERVER_CLEAN#http://}"
            SERVER_CLEAN="${SERVER_CLEAN#https://}"
            SERVER_CLEAN="${SERVER_CLEAN%/}"
            if ! getent ahosts "$SERVER_CLEAN" >/dev/null 2>&1 && ! nslookup "$SERVER_CLEAN" >/dev/null 2>&1; then
              echo "⚠️ NOTICE: Cannot resolve hostname '$SERVER_CLEAN' in DNS."
              echo "👉 Will attempt automatic fallback to Hostinger server IP: 145.79.210.95"
            fi
          fi

          if [ -z "$FTP_USERNAME" ]; then
            echo "❌ ERROR: FTP_USERNAME secret is not configured in GitHub Secrets!"
            MISSING=1
          else
            echo "✅ FTP_USERNAME secret is configured (${#FTP_USERNAME} chars)"
          fi

          if [ -z "$FTP_PASSWORD" ]; then
            echo "❌ ERROR: FTP_PASSWORD secret is not configured in GitHub Secrets!"
            MISSING=1
          else
            echo "✅ FTP_PASSWORD secret is configured"
          fi

          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "ℹ️  FTP_SERVER_DIR is not set; will default to 'public_html/'"
          else
            echo "✅ FTP_SERVER_DIR is configured: $FTP_SERVER_DIR"
          fi

          if [ $MISSING -eq 1 ]; then
            echo "=========================================================="
            echo "❌ Deployment halted due to missing secrets."
            echo "Go to: GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "Add: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR"
            echo "=========================================================="
            exit 1
          fi

      # ========================================================================
      # 3. SETUP RUNTIME ENVIRONMENTS (NODE.JS & PHP)
      # ========================================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP 8.2 & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, fileinfo
          coverage: none
          tools: composer:v2

      # ========================================================================
      # 4. FRONTEND BUILD (REACT + VITE + TAILWIND)
      # ========================================================================
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend for Production
        working-directory: frontend
        env:
          VITE_API_URL: https://archcampus.archenterprises.co.in/api/v1
        run: npm run build

      # ========================================================================
      # 5. BACKEND COMPOSER DEPENDENCIES
      # ========================================================================
      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Backend Production Dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # ========================================================================
      # 6. ASSEMBLE PRODUCTION PAYLOAD
      # ========================================================================
      - name: Prepare Unified Production Payload
        id: prepare-payload
        run: |
          echo "=========================================================="
          echo "📦 Assembling Production Payload Directory..."
          echo "=========================================================="
          rm -rf production_payload
          mkdir -p production_payload/public_html
          mkdir -p production_payload/backend

          # Generate secure one-time deployment token
          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "deploy_token=$DEPLOY_TOKEN" >> "$GITHUB_OUTPUT"

          # 1. Copy Frontend Static Build to public_html/
          if [ -d "frontend/dist" ]; then
            cp -a frontend/dist/. production_payload/public_html/
          else
            echo "❌ ERROR: frontend/dist directory not found!"
            exit 1
          fi

          # Ensure root .htaccess exists in public_html/
          if [ -f "frontend/public/.htaccess" ]; then
            cp "frontend/public/.htaccess" "production_payload/public_html/.htaccess"
          fi

          # Ensure api/ bridge front-controller exists in public_html/api/
          mkdir -p production_payload/public_html/api
          if [ -f "frontend/public/api/index.php" ]; then
            cp "frontend/public/api/index.php" "production_payload/public_html/api/index.php"
          fi

          # 2. Add secure one-time vendor extractor in public_html/
          cat << EOF > production_payload/public_html/extract_vendor.php
<?php
\$token = \$_GET['token'] ?? '';
if (empty(\$token) || \$token !== '$DEPLOY_TOKEN') {
    http_response_code(403);
    die(json_encode(['error' => 'Unauthorized']));
}
header('Content-Type: application/json');

\$backendDir = realpath(__DIR__ . '/../backend');
if (!\$backendDir || !is_dir(\$backendDir)) {
    \$backendDir = realpath(__DIR__ . '/backend');
}

if (!\$backendDir || !is_dir(\$backendDir)) {
    http_response_code(500);
    echo json_encode(['error' => 'Backend directory not found']);
    @unlink(__FILE__);
    exit;
}

\$zipPath = \$backendDir . '/vendor.zip';
if (!file_exists(\$zipPath)) {
    if (file_exists(\$backendDir . '/vendor/autoload.php')) {
        echo json_encode(['status' => 'success', 'message' => 'Vendor already present']);
        @unlink(__FILE__);
        exit;
    }
    http_response_code(404);
    echo json_encode(['error' => 'vendor.zip not found']);
    @unlink(__FILE__);
    exit;
}

if (!class_exists('ZipArchive')) {
    http_response_code(500);
    echo json_encode(['error' => 'ZipArchive PHP extension is not available']);
    @unlink(__FILE__);
    exit;
}

\$zip = new ZipArchive();
if (\$zip->open(\$zipPath) === TRUE) {
    \$zip->extractTo(\$backendDir);
    \$zip->close();
    @unlink(\$zipPath);
    echo json_encode(['status' => 'success', 'message' => 'Vendor extracted successfully']);
} else {
    http_response_code(500);
    echo json_encode(['error' => 'Failed to open vendor.zip']);
}
@unlink(__FILE__);
EOF

          # 3. Copy Backend Application to backend/ (excluding raw vendor directory)
          for item in app bootstrap config database resources routes public artisan composer.json composer.lock; do
            if [ -e "backend/$item" ]; then
              cp -a "backend/$item" "production_payload/backend/"
            fi
          done

          # 4. Create compressed vendor archive (single ~20MB file eliminates 1-hour FTP timeout)
          echo "📦 Compressing backend/vendor into production_payload/backend/vendor.zip..."
          (cd backend && zip -q -r ../production_payload/backend/vendor.zip vendor)

          # Ensure backend/.htaccess exists with strict denial
          if [ -f "backend/.htaccess" ]; then
            cp "backend/.htaccess" "production_payload/backend/.htaccess"
          else
            cat << 'EOF' > production_payload/backend/.htaccess
<IfModule mod_authz_core.c>
    Require all denied
</IfModule>
<IfModule !mod_authz_core.c>
    Deny from all
</IfModule>
EOF
          fi

          # 5. Create required writable storage directory skeletons
          mkdir -p production_payload/backend/storage/framework/{cache/data,sessions,views}
          mkdir -p production_payload/backend/storage/logs
          mkdir -p production_payload/backend/storage/app/public
          mkdir -p production_payload/backend/bootstrap/cache
          touch production_payload/backend/storage/framework/cache/data/.gitkeep
          touch production_payload/backend/storage/framework/sessions/.gitkeep
          touch production_payload/backend/storage/framework/views/.gitkeep
          touch production_payload/backend/storage/logs/.gitkeep
          touch production_payload/backend/storage/app/public/.gitkeep

          # Preserve Composer-generated package & service discovery files (packages.php, services.php)
          rm -f production_payload/backend/bootstrap/cache/config.php \
                production_payload/backend/bootstrap/cache/routes-v7.php \
                production_payload/backend/bootstrap/cache/events.php

          # 6. Strict Security Check: Verify no .env file exists in the payload
          if [ -f "production_payload/.env" ] || [ -f "production_payload/public_html/.env" ] || [ -f "production_payload/backend/.env" ]; then
            echo "❌ CRITICAL SECURITY ERROR: .env file found in production payload! Aborting deployment."
            rm -f production_payload/.env production_payload/public_html/.env production_payload/backend/.env
            exit 1
          fi

          # Remove any local database dumps or development artifacts
          rm -f production_payload/*.sql production_payload/public_html/*.sql production_payload/backend/*.sql

          echo "✅ Production payload successfully assembled."
          ls -la production_payload/
          ls -la production_payload/public_html/
          ls -la production_payload/backend/

      # ========================================================================
      # 7. FORMAT TARGET SERVER & DIRECTORY (Sanitizes Host & Paths)
      # ========================================================================
      - name: Format Target Server & Directory
        id: format-dir
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          # Sanitize server: strip ftp://, http://, https://, and trailing slashes
          SERVER_CLEAN="${RAW_SERVER#ftp://}"
          SERVER_CLEAN="${SERVER_CLEAN#http://}"
          SERVER_CLEAN="${SERVER_CLEAN#https://}"
          SERVER_CLEAN="${SERVER_CLEAN%/}"

          # Fail-safe: Handle accidental swap or dot in FTP_SERVER
          if [ "$SERVER_CLEAN" = "." ] || [ "$SERVER_CLEAN" = "./" ] || [ -z "$SERVER_CLEAN" ]; then
            if [ -n "$RAW_DIR" ] && [ "$RAW_DIR" != "." ] && [ "$RAW_DIR" != "./" ] && [ "$RAW_DIR" != "/" ] && [ "$RAW_DIR" != "public_html" ] && [ "$RAW_DIR" != "public_html/" ]; then
              echo "⚠️ DETECTED SWAPPED SECRETS: Auto-reversing FTP_SERVER ('$SERVER_CLEAN') and FTP_SERVER_DIR ('$RAW_DIR')."
              SERVER_CLEAN="${RAW_DIR#ftp://}"
              SERVER_CLEAN="${SERVER_CLEAN%/}"
              RAW_DIR="./"
            else
              echo "⚠️ NOTICE: FTP_SERVER was set to '$SERVER_CLEAN'. Defaulting to Hostinger server IP 145.79.210.95"
              SERVER_CLEAN="145.79.210.95"
            fi
          elif ! getent ahosts "$SERVER_CLEAN" >/dev/null 2>&1 && ! nslookup "$SERVER_CLEAN" >/dev/null 2>&1; then
            echo "⚠️ NOTICE: Server '$SERVER_CLEAN' cannot be resolved in DNS. Defaulting to Hostinger server IP 145.79.210.95"
            SERVER_CLEAN="145.79.210.95"
          fi
          echo "server_host=$SERVER_CLEAN" >> "$GITHUB_OUTPUT"

          # Format target directory
          if [ -z "$RAW_DIR" ] || [ "$RAW_DIR" = "/" ] || [ "$RAW_DIR" = "." ] || [ "$RAW_DIR" = "./" ]; then
            FORMATTED_DIR="./"
          else
            FORMATTED_DIR="${RAW_DIR%/}/"
          fi
          echo "target_dir=$FORMATTED_DIR" >> "$GITHUB_OUTPUT"
          echo "Formatted deployment target: $FORMATTED_DIR on host $SERVER_CLEAN"

      # ========================================================================
      # 7b. TEST FTP AUTHENTICATION DIAGNOSTIC
      # ========================================================================
      - name: Test FTP Authentication (Diagnostic)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ steps.format-dir.outputs.server_host }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=========================================================="
          echo "🔍 Testing FTP Connection & Authentication..."
          echo "=========================================================="
          curl -s --connect-timeout 10 --max-time 15 "ftp://$FTP_SERVER/" --user "$FTP_USER:$FTP_PASS" && echo "✅ FTP Login Succeeded via curl!" || echo "⚠️ Notice: Direct curl FTP test returned non-zero."

      # ========================================================================
      # 8. DEPLOY PRODUCTION PAYLOAD TO HOSTINGER VIA FTP
      # ========================================================================
      - name: Deploy Production Files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.format-dir.outputs.server_host || secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /
          local-dir: production_payload/
          dangerous-clean-slate: false
          timeout: 300000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            !**/.env.example
            !**/.env.production.example
            **/tests/**
            **/node_modules/**
            **/storage/logs/*.log
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/*.sql

      # ========================================================================
      # 8b. EXTRACT VENDOR ARCHIVE ON HOSTINGER (1.5s Server-Side Extraction)
      # ========================================================================
      - name: Extract Vendor Dependencies on Hostinger
        run: |
          echo "=========================================================="
          echo "⚡ Triggering Server-Side Vendor Archive Extraction..."
          echo "=========================================================="
          DEPLOY_TOKEN="${{ steps.prepare-payload.outputs.deploy_token }}"
          EXTRACT_URL="https://archcampus.archenterprises.co.in/extract_vendor.php?token=$DEPLOY_TOKEN"

          echo "Allowing uploaded files to settle (3s)..."
          sleep 3

          EXTRACT_SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Requesting vendor extraction..."
            RES=$(curl -s --connect-timeout 10 --max-time 60 "$EXTRACT_URL") || true
            echo "Extraction response: $RES"
            if echo "$RES" | grep -q '"status"[[:space:]]*:[[:space:]]*"success"'; then
              EXTRACT_SUCCESS=1
              echo "✅ Vendor dependencies extracted successfully on Hostinger!"
              break
            fi
            sleep 3
          done

          if [ $EXTRACT_SUCCESS -ne 1 ]; then
            echo "⚠️ Notice: Automatic extraction trigger returned non-success. Checking if vendor was already present."
          fi

      # ========================================================================
      # 9. DEPLOYMENT VERIFICATION & HEALTH CHECK (Standard SSL Verification)
      # ========================================================================
      - name: Verify Live Production Website & API Health
        run: |
          echo "=========================================================="
          echo "🌐 Verifying Production Deployment Health..."
          echo "=========================================================="
          echo "Allowing web server processes to settle (5s)..."
          sleep 5

          MAX_RETRIES=3
          RETRY_DELAY=5

          # --------------------------------------------------------------------
          # 1. Verify Frontend Web Root (React SPA)
          # Uses standard SSL certificate verification (no -k / --insecure)
          # --------------------------------------------------------------------
          FRONTEND_OK=0
          FRONTEND_STATUS=0
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Checking https://archcampus.archenterprises.co.in/ ..."
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "https://archcampus.archenterprises.co.in/") || true
            if [ "$FRONTEND_STATUS" -eq 200 ]; then
              FRONTEND_OK=1
              echo "✅ Frontend responded with HTTP 200 OK"
              break
            fi
            echo "⚠️ Attempt $i: Frontend returned HTTP $FRONTEND_STATUS. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ $FRONTEND_OK -ne 1 ]; then
            echo "❌ ERROR: Production frontend failed health verification after $MAX_RETRIES attempts (HTTP $FRONTEND_STATUS)."
            exit 1
          fi

          # --------------------------------------------------------------------
          # 2. Verify Laravel API Health Endpoint (/api/v1/health)
          # Uses standard SSL certificate verification and validates JSON payload
          # --------------------------------------------------------------------
          API_OK=0
          API_STATUS=0
          HEALTH_BODY=""
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Checking https://archcampus.archenterprises.co.in/api/v1/health ..."
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "https://archcampus.archenterprises.co.in/api/v1/health") || true
            HEALTH_BODY=$(curl -s --connect-timeout 10 --max-time 20 "https://archcampus.archenterprises.co.in/api/v1/health") || true

            if [ "$API_STATUS" -eq 200 ] && echo "$HEALTH_BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              API_OK=1
              echo "✅ API responded with HTTP 200 OK and expected payload: $HEALTH_BODY"
              break
            fi
            echo "⚠️ Attempt $i: API returned HTTP $API_STATUS with body: $HEALTH_BODY. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ $API_OK -ne 1 ]; then
            echo "❌ ERROR: Production API health check failed after $MAX_RETRIES attempts."
            echo "Last HTTP Status: $API_STATUS"
            echo "Last Response Body: $HEALTH_BODY"
            exit 1
          fi

          echo "=========================================================="
          echo "🎉 ALL HEALTH CHECKS PASSED: DEPLOYMENT VERIFIED!"
          echo "=========================================================="
