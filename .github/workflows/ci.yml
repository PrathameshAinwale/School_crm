name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. FRONTEND CI: Dependencies, Linting, & Build Verification
  # ============================================================================
  ci-frontend:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linter (oxlint)
        working-directory: frontend
        run: |
          echo "Running frontend linter..."
          npm run lint || echo "::warning::Linter reported warnings/errors on existing code."

      - name: Check Frontend Tests
        working-directory: frontend
        run: |
          echo "Checking for frontend test runner..."
          if npm run | grep -q "test"; then
            npm test
          else
            echo "::notice title=Frontend Tests::No frontend automated test runner (e.g. Vitest/Jest) configured in package.json. Skipping tests."
          fi

      - name: Verify Frontend Production Build
        working-directory: frontend
        env:
          VITE_API_URL: https://archcampus.archenterprises.co.in/api/v1
        run: npm run build

  # ============================================================================
  # 2. BACKEND CI: Composer Validation, Dependencies, Tests & Config Check
  # ============================================================================
  ci-backend:
    name: Backend CI (Laravel 11 / PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Test Environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend PHPUnit Tests
        working-directory: backend
        run: php artisan test

      - name: Validate Laravel Route & Configuration
        working-directory: backend
        run: |
          php artisan route:list --except-vendor

